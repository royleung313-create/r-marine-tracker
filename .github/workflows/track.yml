name: R! Marine AIS Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run AIS tracker
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: node tracker.js
